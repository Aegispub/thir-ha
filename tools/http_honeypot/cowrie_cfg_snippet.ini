# THIR — HTTP Honeypot Plugin
# cowrie_cfg_snippet.ini
#
# Append the correct block to /home/cowrie/cowrie/etc/cowrie.cfg
# on each VM. VM1 and VM2 use DIFFERENT blocks — do not mix them up.
#
# VM1: public-facing, port 8080, all interfaces
# VM2: standby only, port 81, localhost only
#
# How to append on VM1:
#   sudo -u cowrie bash -c '
#   cat >> /home/cowrie/cowrie/etc/cowrie.cfg << "EOF"
#   [http]
#   enabled = true
#   listen_endpoints = tcp:8080:interface=0.0.0.0
#   fake_server = Apache/2.4.41 (Ubuntu)
#   hostname = %(honeypot:hostname)s
#   EOF
#   '
#
# How to append on VM2:
#   sudo -u cowrie bash -c '
#   cat >> /home/cowrie/cowrie/etc/cowrie.cfg << "EOF"
#   [http]
#   enabled = true
#   listen_endpoints = tcp:81:interface=127.0.0.1
#   fake_server = Apache/2.4.41 (Ubuntu)
#   hostname = %(honeypot:hostname)s
#   EOF
#   '
#
# Verify after appending:
#   tail -7 /home/cowrie/cowrie/etc/cowrie.cfg
#
# Re-baseline cowrie.cfg SHA256 after deployment confirmed:
#   sha256sum /home/cowrie/cowrie/etc/cowrie.cfg
#   VM1 old hash: 547d2336b0e2508f44c195790296f1a81c6446b8d7a09aadef42f2db1374e419
#   VM2 old hash: 25e5dd55a38a2e7cc9501c67cea0353333a231366a685ee6dc0ecec0cb6e7909

# ══════════════════════════════════════════════════════════════════
# VM1 BLOCK — Sensor Node · Public-facing · Port 8080
# ══════════════════════════════════════════════════════════════════
[http]
enabled = true
listen_endpoints = tcp:8080:interface=0.0.0.0
fake_server = Apache/2.4.41 (Ubuntu)
hostname = %(honeypot:hostname)s


# ══════════════════════════════════════════════════════════════════
# VM2 BLOCK — Brain Node · Standby · Localhost only · Port 81
# ══════════════════════════════════════════════════════════════════
# [http]
# enabled = true
# listen_endpoints = tcp:81:interface=127.0.0.1
# fake_server = Apache/2.4.41 (Ubuntu)
# hostname = %(honeypot:hostname)s
