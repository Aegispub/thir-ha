name: tests

on:
  pull_request:
    paths:
      - 'tools/**/*.py'
      - 'tests/**/*.py'
  push:
    branches: [oracle-ha]
    paths:
      - 'tools/**/*.py'
      - 'tests/**/*.py'

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run regression tests
        run: |
          for f in tests/test_*.py; do
            echo "== $f"
            python3 "$f" || exit 1
          done
